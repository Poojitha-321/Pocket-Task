<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Profile - PocketTask</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50">
    <div class="min-h-screen flex items-center justify-center">
        <div class="bg-white p-8 rounded-xl shadow-lg max-w-md w-full">
            <h2 class="text-2xl font-bold text-center text-indigo-600 mb-6">Create Your Profile</h2>
            <form id="profileForm" class="space-y-4">
                <div>
                    <label class="block text-gray-700 mb-2">Profile Picture</label>
                    <div class="flex items-center justify-center">
                        <div class="w-24 h-24 rounded-full bg-indigo-100 flex items-center justify-center mb-4">
                            <i class="fas fa-user text-4xl text-indigo-300" id="profileIcon"></i>
                            <img id="profilePreview" class="w-full h-full rounded-full object-cover hidden">
                        </div>
                    </div>
                    <input type="file" id="profilePicture" accept="image/*" class="hidden">
                    <button type="button" onclick="document.getElementById('profilePicture').click()" 
                            class="w-full py-2 px-4 border border-indigo-600 text-indigo-600 rounded-lg hover:bg-indigo-50">
                        Upload Photo
                    </button>
                </div>

                <div>
                    <label class="block text-gray-700 mb-2">Full Name</label>
                    <input type="text" id="fullName" required
                           class="w-full px-4 py-2 rounded-lg border focus:outline-none focus:ring-2 focus:ring-indigo-400">
                </div>

                <div>
                    <label class="block text-gray-700 mb-2">Bio</label>
                    <textarea id="bio" rows="3" 
                            class="w-full px-4 py-2 rounded-lg border focus:outline-none focus:ring-2 focus:ring-indigo-400"
                            placeholder="Tell us about yourself..."></textarea>
                </div>

                <div>
                    <label class="block text-gray-700 mb-2">Location</label>
                    <input type="text" id="location" 
                           class="w-full px-4 py-2 rounded-lg border focus:outline-none focus:ring-2 focus:ring-indigo-400"
                           placeholder="City, Country">
                </div>

                <div>
                    <label class="block text-gray-700 mb-2">Skills</label>
                    <input type="text" id="skills" 
                           class="w-full px-4 py-2 rounded-lg border focus:outline-none focus:ring-2 focus:ring-indigo-400"
                           placeholder="e.g., Teaching, Programming, Design">
                </div>

                <button type="submit" 
                        class="w-full bg-indigo-600 text-white py-2 px-4 rounded-lg hover:bg-indigo-700 transition-colors">
                    Create Profile
                </button>
            </form>
        </div>
    </div>

    <script>
        // Handle profile picture preview
        document.getElementById('profilePicture').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('profilePreview');
                    const icon = document.getElementById('profileIcon');
                    preview.src = e.target.result;
                    preview.classList.remove('hidden');
                    icon.classList.add('hidden');
                }
                reader.readAsDataURL(file);
            }
        });

        // Handle form submission
        document.getElementById('profileForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Get form values
            const profileData = {
                fullName: document.getElementById('fullName').value,
                bio: document.getElementById('bio').value,
                location: document.getElementById('location').value,
                skills: document.getElementById('skills').value,
                profilePicture: document.getElementById('profilePreview').src || ''
            };

            // Save to localStorage
            localStorage.setItem('userProfile', JSON.stringify(profileData));
            localStorage.setItem('userName', profileData.fullName);

            // Show success message
            alert('Profile created successfully!');
            
            // Redirect to home page
            window.location.href = 'index.html';
        });

        // Check if user is logged in
        window.addEventListener('DOMContentLoaded', () => {
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            if (!isLoggedIn) {
                window.location.href = 'login.html';
            }
        });
    </script>
</body>
</html>
