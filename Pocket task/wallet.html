<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PocketTask - My Wallet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-indigo-50 to-purple-50 min-h-screen">
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="index.html" class="text-2xl font-bold text-indigo-600">PocketTask</a>
                </div>
                <div class="flex items-center space-x-4">
                    <div class="flex items-center space-x-2 bg-indigo-100 px-4 py-2 rounded-lg">
                        <i class="fas fa-coins text-yellow-500"></i>
                        <span class="text-indigo-600 font-semibold">500 Coins</span>
                    </div>
                    <div class="flex items-center space-x-2 bg-purple-100 px-4 py-2 rounded-lg">
                        <i class="fas fa-star text-purple-500"></i>
                        <span class="text-purple-600 font-semibold">250 Points</span>
                    </div>
                    <a href="index.html" class="text-gray-600 hover:text-indigo-600">Home</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto px-4 py-8">
        <div class="bg-white rounded-xl shadow-lg p-6">
            <h1 class="text-3xl font-bold text-gray-800 mb-8">My Wallet</h1>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <div class="bg-gradient-to-r from-yellow-400 to-yellow-600 text-white rounded-xl p-6">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-2xl font-bold">Coins</h2>
                        <i class="fas fa-coins text-3xl"></i>
                    </div>
                    <p class="text-4xl font-bold mb-2">500</p>
                    <p class="text-sm opacity-80">Earn coins by posting jobs</p>
                </div>

                <div class="bg-gradient-to-r from-purple-400 to-purple-600 text-white rounded-xl p-6">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-2xl font-bold">Points</h2>
                        <i class="fas fa-star text-3xl"></i>
                    </div>
                    <p class="text-4xl font-bold mb-2">250</p>
                    <p class="text-sm opacity-80">Earn points by building resumes</p>
                </div>
            </div>

            <div class="space-y-4">
                <h2 class="text-xl font-semibold text-gray-800 mb-4">Recent Activity</h2>
                <div class="border-l-4 border-yellow-500 pl-4 py-2">
                    <p class="text-gray-800 font-medium">Posted a Job: Web Developer</p>
                    <p class="text-gray-600">+100 Coins • 2 days ago</p>
                </div>
                <div class="border-l-4 border-purple-500 pl-4 py-2">
                    <p class="text-gray-800 font-medium">Created Resume</p>
                    <p class="text-gray-600">+50 Points • 3 days ago</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
