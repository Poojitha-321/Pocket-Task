<!DOCTYPE html>
<html lang="en">
<!-- Update page title -->
<head>
    <title>PocketTask - Login</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<!-- Update the background gradient -->
<body class="min-h-screen bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-pink-400 via-purple-500 to-purple-600 flex items-center justify-center p-4 overflow-hidden">

<!-- Update animated background elements colors -->
<div class="absolute w-full h-full">
    <div class="absolute w-96 h-96 -left-10 -top-10 bg-pink-400 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-pulse"></div>
    <div class="absolute w-96 h-96 right-1/4 top-1/4 bg-purple-400 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-pulse-slow"></div>
    <div class="absolute w-96 h-96 -right-10 -bottom-10 bg-pink-400 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-pulse-slow"></div>
    <div class="absolute w-96 h-96 left-1/3 bottom-1/4 bg-purple-500 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-pulse-slower"></div>
    <div class="absolute w-96 h-96 left-1/2 top-1/2 bg-pink-500 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-pulse-slower"></div>
</div>
    <!-- Animated Background Elements -->
    <div class="absolute w-full h-full">
        <div class="absolute w-96 h-96 -left-10 -top-10 bg-pink-500 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-pulse"></div>
        <div class="absolute w-96 h-96 right-1/4 top-1/4 bg-yellow-500 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-pulse-slow"></div>
        <div class="absolute w-96 h-96 -right-10 -bottom-10 bg-cyan-500 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-pulse-slow"></div>
        <div class="absolute w-96 h-96 left-1/3 bottom-1/4 bg-green-500 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-pulse-slower"></div>
        <div class="absolute w-96 h-96 left-1/2 top-1/2 bg-purple-500 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-pulse-slower"></div>
    </div>
    <!-- After the background elements and before the style tag -->
        
        <!-- Main Container -->
        <div class="relative bg-white/10 backdrop-blur-lg rounded-3xl p-8 shadow-[0_8px_32px_0_rgba(31,38,135,0.37)] w-full max-w-md border border-white/20 hover:shadow-[0_8px_32px_0_rgba(31,38,135,0.6)] transition-all duration-500 main-container">
            <div id="loginForm" class="transform transition-all duration-500">
                <!-- Update welcome text -->
                <div class="text-center mb-8">
                    <h1 class="text-5xl font-bold text-white mb-3 animate-text bg-gradient-to-r from-teal-500 via-purple-500 to-orange-500 bg-clip-text text-transparent">Welcome to PocketTask</h1>
                    <p class="text-gray-200 text-lg">Sign in to continue your journey</p>
                </div>
    
                <!-- Update the login form to handle redirection -->
                <form class="space-y-6" onsubmit="handleLogin(event)">
                    <!-- Login Form Content -->
                    <div class="group">
                        <label class="block text-white text-sm font-semibold mb-2">Email</label>
                        <input type="email" 
                               class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 focus:border-purple-500 focus:ring-2 focus:ring-purple-500 text-white placeholder-gray-300 transition-all duration-300 hover:bg-white/20"
                               placeholder="Enter your email">
                    </div>
    
                    <div class="group">
                        <label class="block text-white text-sm font-semibold mb-2">Password</label>
                        <input type="password" 
                               class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 focus:border-purple-500 focus:ring-2 focus:ring-purple-500 text-white placeholder-gray-300 transition-all duration-300 hover:bg-white/20"
                               placeholder="Enter your password">
                    </div>
    
                    <button type="submit" class="w-full py-4 bg-gradient-to-r from-purple-500 to-blue-500 text-white font-semibold rounded-xl transition duration-300 transform hover:scale-105 hover:shadow-lg hover:from-purple-600 hover:to-blue-600">
                        Sign In
                    </button>
                </form>
    
                <!-- Add this script at the end of the file, before closing body tag -->
                <script>
                    function getCoins() {
                        return parseInt(localStorage.getItem('userCoins')) || 0;
                    }
    
                    function addCoins(amount) {
                        const currentCoins = getCoins();
                        localStorage.setItem('userCoins', currentCoins + amount);
                    }
    
                    function handleLogin(event) {
                        event.preventDefault();
                        const email = document.querySelector('input[type="email"]').value;
                        const password = document.querySelector('input[type="password"]').value;
    
                        if (email && password) {
                            // Add 1 coin for logging in
                            addCoins(1);
                            
                            // Set login flags
                            localStorage.setItem('justLoggedIn', 'true');
                            localStorage.setItem('isLoggedIn', 'true');
                            localStorage.setItem('userEmail', email);
                            
                            // Check if profile exists
                            const userProfile = localStorage.getItem('userProfile');
                            
                            if (!userProfile) {
                                // Redirect to profile creation if no profile exists
                                window.location.href = 'profile.html';
                            } else {
                                // Redirect to home if profile exists
                                window.location.href = 'index.html';
                            }
                        } else {
                            showNotification('Error ❌', 'Please fill in all fields');
                        }
                    }
                </script>
    
                <!-- Social Login Options -->
                <div class="relative my-8">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-white/20"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-4 bg-transparent text-white/80 text-lg">Or continue with</span>
                    </div>
                </div>
    
                <div class="grid grid-cols-4 gap-4">
                    <button class="p-3 rounded-xl bg-white/10 hover:bg-white/20 transition-all duration-300 hover:scale-110 group">
                        <i class="fab fa-github text-white text-2xl group-hover:text-purple-400 transition-colors"></i>
                    </button>
                    <button class="p-3 rounded-xl bg-white/10 hover:bg-white/20 transition-all duration-300 hover:scale-110 group">
                        <i class="fab fa-twitter text-white text-2xl group-hover:text-blue-400 transition-colors"></i>
                    </button>
                    <button class="p-3 rounded-xl bg-white/10 hover:bg-white/20 transition-all duration-300 hover:scale-110 group">
                        <i class="fab fa-instagram text-white text-2xl group-hover:text-pink-400 transition-colors"></i>
                    </button>
                    <button class="p-3 rounded-xl bg-white/10 hover:bg-white/20 transition-all duration-300 hover:scale-110 group">
                        <i class="fab fa-facebook text-white text-2xl group-hover:text-blue-500 transition-colors"></i>
                    </button>
                </div>
    
                <!-- Sign Up Link -->
                <div class="mt-6 text-center">
                    <p class="text-white/80">Don't have an account?</p>
                    <button onclick="toggleForm('signup')" class="mt-2 text-white font-semibold hover:text-purple-300 transition-colors duration-300">
                        Create an Account
                    </button>
                </div>
            </div>
    
            <div id="signupForm" class="hidden transform transition-all duration-500">
                <!-- Sign Up Form Content -->
                <div class="text-center mb-8">
                    <h1 class="text-5xl font-bold text-white mb-3 animate-text bg-gradient-to-r from-teal-500 via-purple-500 to-orange-500 bg-clip-text text-transparent">Join Us</h1>
                    <p class="text-gray-200 text-lg">Start your amazing journey</p>
                </div>
    
                <form class="space-y-6">
                    <div class="group">
                        <label class="block text-white text-sm font-semibold mb-2">Full Name</label>
                        <input type="text" 
                               class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 focus:border-purple-500 focus:ring-2 focus:ring-purple-500 text-white placeholder-gray-300 transition-all duration-300 hover:bg-white/20"
                               placeholder="Enter your full name">
                    </div>
                    <div class="group">
                        <label class="block text-white text-sm font-semibold mb-2">Email</label>
                        <input type="email" 
                               class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 focus:border-purple-500 focus:ring-2 focus:ring-purple-500 text-white placeholder-gray-300 transition-all duration-300 hover:bg-white/20"
                               placeholder="Enter your email">
                    </div>
                    <div class="group">
                        <label class="block text-white text-sm font-semibold mb-2">Password</label>
                        <input type="password" 
                               class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 focus:border-purple-500 focus:ring-2 focus:ring-purple-500 text-white placeholder-gray-300 transition-all duration-300 hover:bg-white/20"
                               placeholder="Create a password">
                    </div>
    
                    <button class="w-full py-4 bg-gradient-to-r from-purple-500 to-blue-500 text-white font-semibold rounded-xl transition duration-300 transform hover:scale-105 hover:shadow-lg hover:from-purple-600 hover:to-blue-600">
                        Create Account
                    </button>
    
                    <!-- Login Link -->
                    <div class="mt-6 text-center">
                        <p class="text-white/80">Already have an account?</p>
                        <button onclick="toggleForm('login')" class="mt-2 text-white font-semibold hover:text-purple-300 transition-colors duration-300">
                            Sign In
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <!-- Add this right after the existing style tag -->
    <style>
        /* ... existing styles ... */
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 1rem;
            border-radius: 0.5rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            z-index: 1000;
            transform: translateX(200%);
            transition: transform 0.3s ease-out;
        }
    
        .notification.show {
            transform: translateX(0);
        }
    </style>
    
    <!-- Add this right before the closing body tag -->
    <div id="notification" class="notification hidden">
        <h3 class="font-bold mb-1"></h3>
        <p class="text-sm"></p>
    </div>
    
    <script>
        function showNotification(title, message) {
            const notification = document.getElementById('notification');
            notification.querySelector('h3').textContent = title;
            notification.querySelector('p').textContent = message;
            notification.classList.remove('hidden');
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
                setTimeout(() => notification.classList.add('hidden'), 300);
            }, 3000);
        }
    
        function handleLogin(event) {
            event.preventDefault();
            const email = document.querySelector('input[type="email"]').value;
            const password = document.querySelector('input[type="password"]').value;
    
            if (email && password) {
                // Add 1 coin for logging in
                addCoins(1);
                
                // Set login flags
                localStorage.setItem('justLoggedIn', 'true');
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('userEmail', email);
                
                // Check if profile exists
                const userProfile = localStorage.getItem('userProfile');
                
                if (!userProfile) {
                    // Redirect to profile creation if no profile exists
                    window.location.href = 'profile.html';
                } else {
                    // Redirect to home if profile exists
                    window.location.href = 'index.html';
                }
            } else {
                showNotification('Error ❌', 'Please fill in all fields');
            }
        }
    </script>
    </body>
    <style>
        .animate-text {
            background-size: 200% auto;
            animation: textShine 5s linear infinite;
        }
    
        @keyframes textShine {
            to {
                background-position: 200% center;
            }
        }
    
        .animate-pulse-slow {
            animation: pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    
        .animate-pulse-slower {
            animation: pulse 5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    
        /* Add new animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95) translateY(-10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
    
        @keyframes fadeOut {
            from { opacity: 1; transform: scale(1) translateY(0); }
            to { opacity: 0; transform: scale(0.95) translateY(10px); }
        }
    
        .fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
    
        .fade-out {
            animation: fadeOut 0.5s ease-out forwards;
        }
    </style>
    <script>
        function toggleForm(formType) {
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            
            if (formType === 'login') {
                signupForm.classList.add('fade-out');
                setTimeout(() => {
                    loginForm.classList.remove('hidden');
                    signupForm.classList.add('hidden');
                    signupForm.classList.remove('fade-out');
                    loginForm.classList.add('fade-in');
                }, 400);
            } else {
                loginForm.classList.add('fade-out');
                setTimeout(() => {
                    signupForm.classList.remove('hidden');
                    loginForm.classList.add('hidden');
                    loginForm.classList.remove('fade-out');
                    signupForm.classList.add('fade-in');
                }, 400);
            }
        }
    </script>
</body>
</html>
