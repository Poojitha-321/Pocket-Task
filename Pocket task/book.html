<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PocketTask - Book a Service</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="index.html" class="text-2xl font-bold text-indigo-600">PocketTask</a>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="index.html" class="text-gray-600 hover:text-indigo-600">Home</a>
                    <a href="login.html" class="text-gray-600 hover:text-indigo-600">Login</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Booking Section -->
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <div class="bg-white rounded-xl shadow-lg p-8">
            <h2 class="text-3xl font-bold text-gray-800 mb-6">Book a Service</h2>
            
            <form class="space-y-6" onsubmit="handleBooking(event)">
                <!-- Service Selection -->
                <div>
                    <label class="block text-gray-700 font-medium mb-2">Select Service</label>
                    <select class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500" required>
                        <option value="">Choose a service...</option>
                        <option value="catering">Catering</option>
                        <option value="construction">Construction</option>
                        <option value="video">Video Editing</option>
                        <option value="pet">Pet Care</option>
                        <option value="tuition">Tuitions</option>
                        <option value="household">Household Works</option>
                    </select>
                </div>

                <!-- Date Selection -->
                <div>
                    <label class="block text-gray-700 font-medium mb-2">Select Date</label>
                    <input type="date" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500" required>
                </div>

                <!-- Time Slots -->
                <div>
                    <label class="block text-gray-700 font-medium mb-2">Select Time Slot</label>
                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
                        <button type="button" class="px-4 py-2 border rounded-lg hover:bg-indigo-50 focus:ring-2 focus:ring-indigo-500">
                            9:00 AM - 10:00 AM
                        </button>
                        <button type="button" class="px-4 py-2 border rounded-lg hover:bg-indigo-50 focus:ring-2 focus:ring-indigo-500">
                            10:00 AM - 11:00 AM
                        </button>
                        <button type="button" class="px-4 py-2 border rounded-lg hover:bg-indigo-50 focus:ring-2 focus:ring-indigo-500">
                            11:00 AM - 12:00 PM
                        </button>
                        <button type="button" class="px-4 py-2 border rounded-lg hover:bg-indigo-50 focus:ring-2 focus:ring-indigo-500">
                            2:00 PM - 3:00 PM
                        </button>
                        <button type="button" class="px-4 py-2 border rounded-lg hover:bg-indigo-50 focus:ring-2 focus:ring-indigo-500">
                            3:00 PM - 4:00 PM
                        </button>
                        <button type="button" class="px-4 py-2 border rounded-lg hover:bg-indigo-50 focus:ring-2 focus:ring-indigo-500">
                            4:00 PM - 5:00 PM
                        </button>
                    </div>
                </div>

                <!-- Contact Details -->
                <div class="space-y-4">
                    <div>
                        <label class="block text-gray-700 font-medium mb-2">Full Name</label>
                        <input type="text" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500" required>
                    </div>
                    <div>
                        <label class="block text-gray-700 font-medium mb-2">Email</label>
                        <input type="email" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500" required>
                    </div>
                    <div>
                        <label class="block text-gray-700 font-medium mb-2">Phone</label>
                        <input type="tel" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500" required>
                    </div>
                </div>

                <!-- Additional Notes -->
                <div>
                    <label class="block text-gray-700 font-medium mb-2">Additional Notes</label>
                    <textarea class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500" rows="4"></textarea>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-lg hover:bg-indigo-700 transition-colors">
                    Book Now
                </button>
            </form>
        </div>
    </div>

    <script>
        // Handle time slot selection
        document.querySelectorAll('[type="button"]').forEach(button => {
            button.addEventListener('click', () => {
                // Remove selected class from all buttons
                document.querySelectorAll('[type="button"]').forEach(btn => {
                    btn.classList.remove('bg-indigo-100');
                });
                // Add selected class to clicked button
                button.classList.add('bg-indigo-100');
            });
        });

        // Handle form submission
        function handleBooking(event) {
            event.preventDefault();
            alert('Booking request submitted successfully! We will contact you shortly.');
            event.target.reset();
            // Remove selected time slot
            document.querySelectorAll('[type="button"]').forEach(btn => {
                btn.classList.remove('bg-indigo-100');
            });
        }
    </script>
</body>
</html>
